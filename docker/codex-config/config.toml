# Codex CLI config for MetaClaw's Docker runtime.
#
# Mounted read-only as /codex-config-template and copied into the writable
# ~/.codex/config.toml at container start (see docker/entrypoint.sh), which
# substitutes the __OPENAI_BASE_URL__ placeholder from the OPENAI_BASE_URL env
# var (set in docker/pi.env — the single API config entry point).
#
# Nothing live is hardcoded here: the API key comes from the env var named by
# `env_key` (OPENAI_API_KEY), and base_url comes from OPENAI_BASE_URL. Change
# supplier by editing only docker/pi.env.
model = "gpt-5.4"
model_provider = "anyint"
# Some OpenAI-compatible gateways only accept tool types function/mcp/
# knowledge_search. Several of codex's stable features (apps, multi_agent,
# unified_exec, tool_suggest, goals, guardian_approval) register tools with type
# "namespace", which such gateways reject with HTTP 400. Disable them. MetaClaw
# owns multi-agent/goal/approval orchestration itself, and research/web tasks
# route to the pi executor, so codex only needs its core function tools here.
web_search = "disabled"

[features]
apps = false
multi_agent = false
unified_exec = false
tool_suggest = false
goals = false
guardian_approval = false

[model_providers.anyint]
name = "AnyInt"
base_url = "__OPENAI_BASE_URL__"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
