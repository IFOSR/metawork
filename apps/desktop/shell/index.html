<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>MetaWork</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main>
    <span class="wordmark">MetaWork</span>
    <div class="indicator" aria-hidden="true"></div>
    <h1>让工作继续</h1>
    <p id="status" role="status" aria-live="polite">正在连接后台服务…</p>
    <section id="update-status" hidden aria-live="polite" aria-label="更新进度">
      <div class="progress-track"><div id="update-progress" class="progress-value"></div></div>
      <p id="update-hint">更新正在进行，请不要重复点击或重新打开 MetaWork。完成后应用会自动重启。</p>
    </section>
    <button id="retry" hidden>重新连接</button>
    <button id="upgrade" hidden>完成更新并重启</button>
    <p class="note">关闭窗口或退出桌面，后台工作仍会继续。</p>
  </main>
  <script src="shell.js"></script>
</body>
</html>
