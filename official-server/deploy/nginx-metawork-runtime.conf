# huoshan: public HTTPS entry for the MetaWork Runtime Web UI (v0.1.26+).
# nginx owns the public 8788 listener; the Runtime itself moved to loopback
# 127.0.0.1:18788 (METAWORK_WEB_PORT) so it is never reachable directly. The Web
# UI hands out a transport session to any reachable client (loopback is the
# intended boundary), so nginx adds an independent Basic-auth gate. The
# WebSocket/API Origin check only accepts a loopback origin on the Runtime's
# listening port, so the backend leg rewrites Host and Origin to 127.0.0.1:18788.
server {
    listen 8788 ssl;
    listen [::]:8788 ssl;
    server_name 14.103.216.193;

    ssl_certificate /etc/letsencrypt/live/14.103.216.193/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/14.103.216.193/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MetaWorkRuntimeTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;
    client_body_timeout 60s;

    location / {
        auth_basic "MetaWork Runtime";
        auth_basic_user_file /etc/nginx/metawork-runtime.htpasswd;

        proxy_pass http://127.0.0.1:18788;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18788;
        proxy_set_header Origin http://127.0.0.1:18788;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
