# Example only. Prefer creating the real Secret with kubectl so values never sit in a file:
#   kubectl -n metawork create secret generic metawork-official-secrets \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=PAYMENT_HUB_CLIENT_ID='<32-hex client id>' \
#     --from-literal=PAYMENT_HUB_CLIENT_SECRET='<client secret>' \
#     --from-literal=PAYMENT_NOTIFY_URL='https://opchub-openapi.metafusion.cn/v1/payments/notify' \
#     --from-literal=MODEL_BASE_URL='https://<openai-compatible upstream>' \
#     --from-literal=MODEL_API_KEY='<upstream key>' \
#     --from-literal=MODEL_ID='<upstream model id>'
apiVersion: v1
kind: Secret
metadata:
  name: metawork-official-secrets
  namespace: nexusfusionai
type: Opaque
stringData:
  ADMIN_TOKEN: ""
  PAYMENT_HUB_CLIENT_ID: ""   # 生产 Client ID 部署时注入
  PAYMENT_HUB_CLIENT_SECRET: ""
  PAYMENT_NOTIFY_URL: "https://metawork.nexusfusionai.com/v1/payments/notify"
  MODEL_BASE_URL: ""
  MODEL_API_KEY: ""
  MODEL_ID: ""
  # 实例工作负载镜像（可选；缺省仅实例创建接口返回 instance_unavailable）。
  RUNTIME_IMAGE: ''
  # 私有仓库拉取凭据 Secret 名（可选）。
  RUNTIME_IMAGE_PULL_SECRET: ''
  # 免密登录钥匙/门票的 HMAC 密钥（≥32 字符；实例镜像配置时启动强制校验）。
  RUNTIME_ACCESS_SECRET: ''
