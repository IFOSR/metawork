# 实例预配权限（namespace 级，白名单收敛）。
# 方案：docs/plans/2026-11-09-official-runtime-provisioning-design.md §4。
# Role 不是 ClusterRole：权限出不了 nexusfusionai；secrets/nodes/集群级对象一律不可见。
# 白名单六种资源对应创建链：PVC / Deployment / VPA / Service / Ingress + Pod 状态读取。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metawork-official-provisioner
  namespace: nexusfusionai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metawork-official-provisioner
  namespace: nexusfusionai
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch"]
  # 停机/重启/版本更新：scale 子资源 + 对 Deployment 模板的 strategic-merge patch。
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metawork-official-provisioner
  namespace: nexusfusionai
subjects:
  - kind: ServiceAccount
    name: metawork-official-provisioner
    namespace: nexusfusionai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metawork-official-provisioner
