# huoshan: /etc/nginx/sites-available/metawork-official
server {
    listen 9222 ssl;
    listen [::]:9222 ssl;
    server_name 14.103.216.193;

    ssl_certificate /etc/letsencrypt/live/14.103.216.193/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/14.103.216.193/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MetaWorkOfficialTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;
    client_body_timeout 15s;

    # Official administration is available only over SSH to the loopback backend.
    location ^~ /v1/admin { return 404; }

    location = /v1/ai/operation {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
    }
}
