<!doctype html>
<html lang="zh-CN" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaWork</title>
    <script>
      (() => {
        const key = 'metawork.theme';
        const legacyKey = 'anyfusion.theme';
        const canonical = localStorage.getItem(key);
        const legacy = localStorage.getItem(legacyKey);
        const stored = canonical ?? legacy;
        const preference = stored === 'light' || stored === 'dark' || stored === 'system'
          ? stored
          : 'system';
        if (canonical === null && legacy !== null) localStorage.setItem(key, preference);
        if (legacy !== null) localStorage.removeItem(legacyKey);
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
