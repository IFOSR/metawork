name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METAWORK_PI_COMMAND: ${{ github.workspace }}/.tmp/pi-build-host/bin/pi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 完整的提交历史：跨仓库契约测试（tests/acceptance/
          # task8-cross-repository-contract.test.ts）需要校验被固定的契约提交
          # 是 HEAD 的祖先，而 checkout 默认只拉取一个提交（fetch-depth: 1）。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The root test suite resolves react-dom/server through web/node_modules,
      # so web dependencies must exist before tests run.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Prepare isolated upstream Pi build host
        run: node scripts/prepare-pi-build-host.mjs

      - name: Type-check
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Verify packaged upstream Pi Manager and Executor
        run: npx vitest run tests/e2e/packaged-pi-native.test.ts
        env:
          RUN_PACKAGED_PI_E2E: '1'

      - name: Build distribution
        run: npm run build

      - name: Build web frontend
        run: npm run build
        working-directory: web
