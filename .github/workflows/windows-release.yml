name: Build Windows release

on:
  push:
    tags:
      - 'v*-windows'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify Windows tag and package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)-windows$') {
            throw "Windows release tag must be v<version>[-prerelease]-windows"
          }
          $version = $Matches[1]
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $version) {
            throw "Windows tag version $version does not match package version $packageVersion"
          }
      - name: Write release signing key
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.METAWORK_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw 'METAWORK_RELEASE_SIGNING_KEY is required' }
          $env:RELEASE_SIGNING_KEY | Out-File -FilePath "$env:RUNNER_TEMP\metawork-release-key.pem" -Encoding utf8 -NoNewline
      # The packaged Runtime ships the memory engine and the planner is built
      # from source, so both pinned inputs are prepared before packaging.
      - name: Install dependencies
        run: npm ci
      - name: Prepare pinned memory engine
        run: node scripts/prepare-memory-engine.mjs
      - name: Verify memory engine (FTS5 gate)
        run: node scripts/verify-memory-engine.mjs --timeout-ms 180000
      # Only the memory engine changed for this release, so the Runtime and
      # Planner archives are carried over from the published Release instead of
      # being rebuilt. Each archive keeps its exact bytes, which keeps the signed
      # manifest valid and turns a full rebuild into a short one.
      # Reuse is an optimisation: if the published archives cannot be fetched the
      # build falls back to producing every archive instead of failing.
      - name: Fetch published archives to reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "$env:RUNNER_TEMP\metawork-reuse"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          gh release view $env:GITHUB_REF_NAME --repo IFOSR/metawork --json assets --jq '.assets[].name' > "$env:RUNNER_TEMP\assets.txt"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::notice::no published Windows Release yet; every archive will be built'
            exit 0
          }
          $names = @(Get-Content "$env:RUNNER_TEMP\assets.txt" | Where-Object { $_ -match '\.zip$' })
          Write-Host "::notice::published archives: $($names -join ', ')"
          if ($names.Count -lt 2) {
            Write-Host '::notice::fewer than two published archives; every archive will be built'
            exit 0
          }
          foreach ($name in $names) {
            gh release download $env:GITHUB_REF_NAME --repo IFOSR/metawork --pattern $name --dir $out --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "could not download $name; every archive will be built"
              exit 0
            }
          }
          Get-ChildItem $out -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "reusable: $($_.Name) ($($_.Length) bytes)"
          }
          Write-Host "::notice::reusing $((Get-ChildItem $out -Filter '*.zip').Count) published archive(s)"
          exit 0
      - name: Build and package Windows Runtime
        shell: pwsh
        env:
          METAWORK_RELEASE_SIGNING_KEY: ${{ secrets.METAWORK_RELEASE_SIGNING_KEY }}
        run: |
          $version = [regex]::Match($env:GITHUB_REF_NAME, '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)-windows$').Groups[1].Value
          if ($version -match '-preview\.\d+$') {
            $channel = 'preview'
            $releaseId = $version
          } else {
            $channel = 'stable'
            $releaseId = "$version-build-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          # The Windows package is published as its own Release. A platform
          # release may not mix artifacts from another commit into the main
          # release: the release verifier requires one identical release set.
          $reuse = "$env:RUNNER_TEMP\metawork-reuse"
          $reusable = (Get-ChildItem $reuse -Filter '*.zip' -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($reusable -ge 2) {
            Write-Host 'Reusing published Runtime and Planner archives; rebuilding only the memory engine.'
            npm run build:release -- `
              --platform win32 `
              --arch x64 `
              --package-only `
              --reuse-archives $reuse `
              --channel $channel `
              --release-id $releaseId `
              --artifact-base-url "https://github.com/IFOSR/metawork/releases/download/v$version-windows" `
              --signing-key "$env:RUNNER_TEMP\metawork-release-key.pem" `
              --out-dir "$env:RUNNER_TEMP\metawork-release"
          } else {
            npm run build:release -- `
              --platform win32 `
              --arch x64 `
              --channel $channel `
              --release-id $releaseId `
              --artifact-base-url "https://github.com/IFOSR/metawork/releases/download/v$version-windows" `
              --signing-key "$env:RUNNER_TEMP\metawork-release-key.pem" `
              --out-dir "$env:RUNNER_TEMP\metawork-release"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: metawork-windows-x64
          path: ${{ runner.temp }}/metawork-release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: metawork-windows-x64
          path: release-assets
      - name: Publish the Windows-only Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                 # v0.1.22-windows
          VERSION="${TAG#v}"
          VERSION="${VERSION%-windows}"
          # An earlier run of this workflow pushed Windows assets into the shared
          # version Release, where they mix commits and break its verification.
          # The Windows package now lives only in its own Release, so any such
          # leftover is removed here.
          SHARED="v${VERSION}"
          if gh release view "$SHARED" --repo IFOSR/metawork >/dev/null 2>&1; then
            for asset in $(gh release view "$SHARED" --repo IFOSR/metawork --json assets \
              --jq '.assets[].name' | grep -E 'win32-x64|^install\.ps1$' || true); do
              gh release delete-asset "$SHARED" "$asset" --yes || true
            done
          fi
          # Never promote this Release to latest: the main branch publishes the
          # macOS and Linux downloads from its own latest Release.
          if ! gh release view "$TAG" --repo IFOSR/metawork >/dev/null 2>&1; then
            gh release create "$TAG" --repo IFOSR/metawork --prerelease \
              --title "MetaWork Windows x64 ${VERSION}" \
              --notes "Native Windows x64 Server package: Web workspace, native TUI and Feishu against one local Server. Runs without WSL, Docker, administrator rights or Developer Mode. Requires Node.js 22.x (at least 22.19.0). macOS and Linux are published from the main branch: https://github.com/IFOSR/metawork/blob/main/README.md"
          fi
          cp scripts/install.ps1 release-assets/install.ps1
          gh release upload "$TAG" --repo IFOSR/metawork release-assets/* --clobber
          mkdir downloaded-release
          gh release download "$TAG" --repo IFOSR/metawork --dir downloaded-release
          METAWORK_RELEASE_TARGETS=win32-x64 METAWORK_REQUIRE_DESKTOP=false \
            node scripts/verify-release-assets.mjs downloaded-release "$TAG"
