name: Windows Desktop implementation validation

on:
  workflow_dispatch:
  push:
    branches: ['feat/windows-desktop']
    paths:
      - '.github/workflows/windows-desktop-validation.yml'
      - 'scripts/probe-windows-desktop-environment.mjs'
      - 'scripts/probe-windows-file-durability.ps1'
      - 'scripts/smoke-desktop-isolated.mjs'
      - 'scripts/probe-windows-desktop-pipe.ps1'
      - 'scripts/probe-windows-desktop-standard-user.ps1'
      - 'scripts/probe-windows-desktop-node-api.mjs'
      - 'scripts/probe-windows-desktop-private-files.mjs'
      - 'scripts/probe-windows-desktop-async-pipe.mjs'
      - 'scripts/probe-windows-desktop-remote-pipe.ps1'
      - 'scripts/probe-windows-desktop-process.ps1'
      - 'scripts/smoke-unified-gateway.mjs'
      - 'scripts/prepare-pi-pdf.mjs'
      - 'scripts/install.ps1'
      - 'scripts/prepare-windows-desktop-tools.mjs'
      - 'scripts/prepare-windows-desktop-candidate.mjs'
      - 'scripts/prepare-windows-pageant.mjs'
      - 'integrations/ssh2-pageant/**'
      - 'scripts/probe-windows-desktop-install.mjs'
      - 'scripts/probe-windows-desktop-nsis.mjs'
      - 'scripts/probe-windows-desktop-update.mjs'
      - 'integrations/windows-desktop-tools/**'
      - 'integrations/pi-pdf/**'
      - 'native/windows-probe/**'
      - 'native/windows/**'
      - 'scripts/probe-windows-platform-files.mjs'
      - 'scripts/probe-windows-platform-standard-user.ps1'
      - 'scripts/probe-windows-platform-pipes.mjs'
      - 'scripts/probe-windows-gateway-security.*'
      - 'apps/desktop/**'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'planner/AnyFusion-Pi/**'
      - 'package*.json'

# Validation artifacts only: no release, signing secrets, deployment or main writes.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.classify.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          before = event.get('before', '')
          macos = True
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and re.fullmatch(r'[a-f0-9]{40}', before) and before != '0' * 40:
            if subprocess.run(['git', 'cat-file', '-e', before], capture_output=True).returncode:
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', before], check=True)
            paths = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
            windows_only = ('native/windows-probe/', 'native/windows/', 'scripts/probe-windows-', 'scripts/probe-windows11-',
                            'scripts/monitor-windows11-', 'scripts/windows11-cloud-', '.github/workflows/windows11-')
            macos = any(not (p.startswith(windows_only) or p.startswith('docs/') or p == 'CONTEXT.md') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('macos=' + str(macos).lower() + '\n')
          print('Run macOS regressions:', macos, '(manual runs always include both architectures)')
          PY
  windows-pipe:
    concurrency:
      group: windows-desktop-pipe-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify native pipe identity and cross-account denial
        shell: pwsh
        run: ./scripts/probe-windows-desktop-pipe.ps1
      - name: Verify the same pipe boundary with a standard-user server
        shell: pwsh
        run: ./scripts/probe-windows-desktop-pipe.ps1 -StandardUser
      - name: Verify remote-client flag using SMB loopback and positive control
        shell: pwsh
        run: ./scripts/probe-windows-desktop-remote-pipe.ps1
      - name: Verify process-tree pause, resume and cancellation
        shell: pwsh
        run: |
          ./scripts/probe-windows-desktop-process.ps1
          ./scripts/probe-windows-desktop-process.ps1 -StandardUser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pipe-${{ github.sha }}
          path: .tmp/windows-desktop-validation/
          if-no-files-found: warn

  windows-environment:
    concurrency:
      group: windows-desktop-environment-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Collect native Windows prerequisite evidence
        run: node scripts/probe-windows-desktop-environment.mjs
      - name: Inspect native file and directory durability primitives
        shell: pwsh
        run: ./scripts/probe-windows-file-durability.ps1
      - name: Verify prerequisites with a standard user and developer mode
        shell: pwsh
        run: ./scripts/probe-windows-desktop-standard-user.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-environment-${{ github.sha }}
          path: .tmp/windows-desktop-validation/
          if-no-files-found: error

  windows-build:
    concurrency:
      group: windows-desktop-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - run: npm ci --prefix web --ignore-scripts
      - run: npm ci --prefix apps/desktop
      - run: npm ci --prefix planner/AnyFusion-Pi --ignore-scripts
      - run: npm run build:offline --prefix planner/AnyFusion-Pi
      - run: npm run lint
      - run: npm run lint:desktop
      - name: Build production Windows Node-API module
        id: native-build
        working-directory: native/windows
        run: node ../../apps/desktop/node_modules/node-gyp/bin/node-gyp.js rebuild --msvs_version=2022
      - name: Verify Desktop tickets stay disabled on unverified Node named pipes
        run: npm test -- tests/gateway/desktop-local-transport.test.ts tests/management/desktop-session.test.ts tests/installation/desktop-platform.test.ts tests/installation/windows-installation-root.test.ts tests/installation/windows-desktop-release.test.ts tests/installation/desktop-install-cli.test.ts tests/client/server-readiness.test.ts tests/executor/pi-native-launch.test.ts tests/executor/pi-cli-driver.test.ts tests/executor/runtime-home-materializer.test.ts
      - run: npm run build
      - run: npm run build:desktop
        id: desktop-build
      - name: Verify native private directory creation and atomic file replacement
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/probe-windows-platform-files.mjs --reuse-build
      - name: Verify native private file writes without administrator rights
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/probe-windows-platform-standard-user.ps1
      - name: Verify persistent native pipe listener and concurrent clients
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/probe-windows-platform-pipes.mjs
      - name: Verify native Duplex backpressure and client lifecycle
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: npm test -- tests/platform/windows-pipe.test.ts tests/platform/windows-process.test.ts tests/tui-bridge/planner-host-bridge.test.ts tests/platform/atomic-replace.test.ts tests/platform/windows-private-stores.test.ts tests/gateway/windows-desktop-transport.test.ts tests/gateway/windows-server-stop.test.ts tests/management/lock.test.ts
      - name: Verify production Gateway denial across standard accounts and SMB
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/probe-windows-gateway-security.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gateway-security-${{ github.sha }}
          path: .tmp/windows-desktop-validation/gateway-security/
          if-no-files-found: warn
      - run: npm run test:desktop
      - name: Exercise native SQLite binding
        run: node --input-type=module -e "import Database from 'better-sqlite3'; const db = new Database(':memory:'); db.exec('CREATE TABLE probe (value INTEGER); INSERT INTO probe VALUES (1)'); if (db.prepare('SELECT value FROM probe').get().value !== 1) throw Error('SQLite probe failed'); db.close();"
      - name: Verify Planner CLI on Windows
        run: node planner/AnyFusion-Pi/packages/coding-agent/dist/cli.js --version
      - name: Probe Node-API carrier in Node and Electron Main
        run: node scripts/probe-windows-desktop-node-api.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-files-${{ github.sha }}
          path: .tmp/windows-desktop-validation/platform-files/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-pipes-${{ github.sha }}
          path: .tmp/windows-desktop-validation/platform-pipes/
          if-no-files-found: warn
      - name: Prepare pinned relocatable Node, Git Bash and Pi tools
        id: tools
        if: ${{ !cancelled() && steps.desktop-build.outcome == 'success' }}
        run: node scripts/prepare-windows-desktop-tools.mjs "${{ runner.temp }}/desktop-tools"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tools-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-tools/tools-provenance.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-node-api-${{ github.sha }}
          path: .tmp/windows-desktop-validation/node-api/
          if-no-files-found: warn
      - name: Configure declared Developer Mode prerequisite for packaged Desktop
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.native-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $policy -Force | Out-Null
          Set-ItemProperty -Path $policy -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1
          $enabled = (Get-ItemProperty -Path $policy -Name AllowDevelopmentWithoutDevLicense).AllowDevelopmentWithoutDevLicense -eq 1
          if (-not $enabled) { throw 'Desktop acceptance requires Developer Mode for ordinary-user symbolic links' }
          New-Item -ItemType Directory -Force .tmp/windows-desktop-validation/candidate | Out-Null
          @{ developerMode = $enabled; scope = 'disposable-runner-prerequisite' } | ConvertTo-Json | Set-Content .tmp/windows-desktop-validation/candidate/prerequisites.json
      - name: Validate combined candidate Runtime and Desktop resources
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.native-build.outcome == 'success' }}
        env:
          METAWORK_TEST_MODEL: ${{ secrets.METAWORK_TEST_MODEL }}
        run: node scripts/prepare-windows-desktop-candidate.mjs "${{ runner.temp }}/desktop-tools" "${{ runner.temp }}/desktop-candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-${{ github.sha }}
          path: .tmp/windows-desktop-validation/candidate/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-nsis-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-candidate/shell/MetaWork-win32-x64-setup.exe
            .tmp/windows-desktop-validation/candidate/candidate.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      # Windows Server automation does not satisfy Windows 11 product acceptance.

  macos-regression:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    concurrency:
      group: windows-desktop-macos-${{ matrix.runner }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - run: npm ci --prefix web --ignore-scripts
      - run: npm ci --prefix apps/desktop
      - run: npm ci --prefix planner/AnyFusion-Pi --ignore-scripts
      - run: npm run build:offline --prefix planner/AnyFusion-Pi
      - run: npm run lint
      - run: npm run lint:desktop
      - name: Shared Server, client, Web, TUI and installer regressions
        run: npm test -- tests/platform tests/client tests/gateway tests/tui-bridge tests/installation tests/server tests/web tests/management tests/architecture tests/executor tests/configuration tests/integration/independent-client-lifecycle.integration.test.ts
      - run: npm run test:desktop
      - run: npm run build
      - run: npm run smoke:gateway
      - name: Real Electron with isolated fixture configuration
        run: node scripts/smoke-desktop-isolated.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-regression-${{ matrix.runner }}-${{ github.sha }}
          path: .tmp/windows-desktop-validation/
          if-no-files-found: warn

  persistence-docker-regression:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    concurrency:
      group: windows-desktop-persistence-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the existing Linux regression image
        run: docker build -f Dockerfile.test -t metawork-windows-regression .
      - name: Verify unchanged persistence and recovery contracts in Docker
        run: >-
          docker run --rm metawork-windows-regression npm test --
          tests/configuration/file-configuration-repository.test.ts
          tests/configuration/activation-journal.test.ts
          tests/session/file-conversation-store.test.ts
          tests/storage/file-conversation-presentation-store.test.ts
          tests/gateway/segmented-event-journal.test.ts
          tests/server/account-event-journal.test.ts
          tests/installation/account-layout-migrator.test.ts
          tests/installation/source-native-installer.test.ts
          tests/installation/release-pointer-transaction.test.ts
