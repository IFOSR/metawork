name: Repair Linux release asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to complete
        required: true
        default: v0.1.14
      source_commit:
        description: Exact source commit used by the release
        required: true
        default: 1b2543465380b9fdef6af62c3a68a9529232d378

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Build signed Linux x64 archives
        env:
          METAWORK_RELEASE_SIGNING_KEY: ${{ secrets.METAWORK_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$METAWORK_RELEASE_SIGNING_KEY"
          version="$(node -p "require('./package.json').version")"
          revision="$(git rev-parse --short=7 HEAD)"
          tag="${{ inputs.release_tag }}"
          test "$version" = "${tag#v}"
          if [[ "$version" =~ -preview\.[0-9]+$ ]]; then
            channel=preview
            release_id="$version"
          else
            channel=stable
            release_id="${version}-build-${revision}"
          fi
          printf '%s\n' "$METAWORK_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/metawork-release-key.pem"
          npm run build:release -- \
            --platform linux \
            --arch x64 \
            --channel "$channel" \
            --release-id "$release_id" \
            --artifact-base-url "https://github.com/IFOSR/metawork/releases/download/${{ inputs.release_tag }}" \
            --signing-key "$RUNNER_TEMP/metawork-release-key.pem" \
            --out-dir "$RUNNER_TEMP/metawork-release"

      - name: Verify Linux manifest and archives
        env:
          RELEASE_DIR: ${{ runner.temp }}/metawork-release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash, verify } from 'node:crypto';
          import { readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = process.env.RELEASE_DIR;
          const manifest = JSON.parse(readFileSync(join(dir, 'manifest.linux-x64.json'), 'utf8'));
          const { signature, ...payload } = manifest;
          const stable = value => Array.isArray(value) ? `[${value.map(stable).join(',')}]`
            : value && typeof value === 'object' ? `{${Object.entries(value).sort(([a], [b]) => a.localeCompare(b)).map(([key, nested]) => `${JSON.stringify(key)}:${stable(nested)}`).join(',')}}`
            : JSON.stringify(value);
          const publicKey = `-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAFUfe0iqiIaYSMGiyywur13FpzoXRQBqAZB0gzEi2DE0=\n-----END PUBLIC KEY-----`;
          if (manifest.platform !== 'linux' || manifest.arch !== 'x64' || signature.keyId !== 'metawork-release-2026-03'
            || !verify(null, Buffer.from(stable(payload)), publicKey, Buffer.from(signature.value, 'base64'))) throw new Error('manifest verification failed');
          for (const kind of ['metawork', 'planner']) {
            const artifact = manifest[kind];
            const file = join(dir, artifact.url.split('/').at(-1));
            const bytes = readFileSync(file);
            if (bytes.length !== artifact.byteSize || createHash('sha256').update(bytes).digest('hex') !== artifact.sha256) throw new Error(`${kind} archive verification failed`);
          }
          console.log(`Verified ${manifest.releaseId} linux-x64`);
          NODE

      - name: Upload Linux assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            "$RUNNER_TEMP/metawork-release/manifest.linux-x64.json" \
            "$RUNNER_TEMP/metawork-release/metawork-"*.tar.gz \
            "$RUNNER_TEMP/metawork-release/planner-"*.tar.gz \
            scripts/install.sh scripts/install.ps1
