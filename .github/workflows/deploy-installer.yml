name: Deploy Release Installer

on:
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag to publish to the installation server
        required: true
        type: string
    secrets:
      RELEASE_DEPLOY_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to publish to the installation server
        required: true
        default: v0.1.2-release
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-installer
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync release assets and installers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/metawork-release"
          mkdir -p "$RUNNER_TEMP/metawork-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/metawork-release"
          cp scripts/install.sh scripts/install.ps1 "$RUNNER_TEMP/metawork-release/"

      - name: Prepare SSH credentials
        run: |
          set -euo pipefail
          test -n "$RELEASE_DEPLOY_KEY"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '14.103.216.193 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQ30E4JL1NegW2gVxV5q6Wcz05lzn+8E3rDcOQ+giIy' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify release
        env:
          METAWORK_DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          node scripts/deploy-release.mjs \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$RUNNER_TEMP/metawork-release" \
            --remote root@14.103.216.193

      - name: Clean up SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
